    --bg:#FCFCFB; --ink:#181A19; --dim:#8A8F8C;
    --mint:#8CE7C0; --mint-soft:#D6F7E7; --mint-deep:#3FB98A; --line:#E7E7E3;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  ::selection{background:var(--mint); color:var(--ink);}
  html{scroll-behavior:smooth;}
  body{

  }

  .wrap{max-width:820px; margin:0 auto; padding:0 28px; position:relative; z-index:1;}

  #progress{position:fixed; top:0; left:0; height:3px; width:0; background:var(--mint-deep); z-index:50; transition:width .1s linear;}

  .orb{position:fixed; border-radius:50%; filter:blur(70px); opacity:.5; z-index:0; pointer-events:none;
       background:radial-gradient(circle at 30% 30%, var(--mint), transparent 70%);}
  .orb.a{width:420px; height:420px; top:-120px; right:-80px; animation:drift1 18s ease-in-out infinite;}
  .orb.b{width:360px; height:360px; bottom:8%; left:-140px; opacity:.35; animation:drift2 22s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}

  nav{display:flex; justify-content:space-between; align-items:center; padding:24px 0; flex-wrap:wrap; gap:14px;
      position:sticky; top:0; z-index:20; background:rgba(252,252,251,.8); backdrop-filter:blur(10px); border-bottom:1px solid transparent; transition:border-color .3s;}
  nav.scrolled{border-color:var(--line);}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo .mark{width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
  .logo .mark img, .logo .mark svg{width:100%; height:100%; object-fit:contain; display:block;}
  .logo:hover .mark{animation:wobble .6s ease;}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .logo .wordmark{font-weight:600; font-size:1.02rem; letter-spacing:-.02em;}
  .navright{display:flex; align-items:center; gap:18px;}
  .sys{font-size:.74rem; color:var(--dim);}
  .sys .ok{color:var(--mint-deep); font-weight:500;}
  .sys .ok::after{content:"●"; font-size:.5em; vertical-align:middle; margin-left:4px; animation:pulse 1.6s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .langbtn{background:none; border:1px solid var(--line); color:var(--ink); font-family:inherit;
    font-size:.74rem; font-weight:500; border-radius:8px; padding:6px 13px; cursor:pointer; transition:border-color .2s, color .2s, background .2s;}
  .langbtn:hover{border-color:var(--mint-deep); color:var(--mint-deep); background:var(--mint-soft);}

  .hero{padding:80px 0 60px; text-align:center;}
  .heroLogo{width:128px; height:128px; margin:0 auto 30px; display:flex; align-items:center; justify-content:center; animation:bob 4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .heroLogo img, .heroLogo svg{width:100%; height:100%; object-fit:contain;}
  .heroLogo .drop{transform-origin:center; animation:drip 3.2s ease-in infinite;}
  @keyframes drip{0%,60%{transform:translateY(0); opacity:1}80%{transform:translateY(6px); opacity:.7}100%{transform:translateY(0); opacity:1}}
  .kicker{font-size:.78rem; color:var(--mint-deep); text-transform:uppercase; letter-spacing:.2em; font-weight:600;}
  h1{font-size:clamp(2.6rem,8vw,4.4rem); font-weight:600; letter-spacing:-.035em; line-height:1.02; margin:14px 0 0;}
  h1 .hl{color:var(--mint-deep);}
  .rotline{font-size:clamp(1rem,2.6vw,1.25rem); color:#545956; max-width:600px; margin:24px auto 0; line-height:1.5; min-height:1.6em;}
  .rot{color:var(--ink); font-weight:600;}
  .caret{display:inline-block; width:2px; height:1.05em; background:var(--mint-deep); vertical-align:text-bottom; margin-left:1px; animation:blink 1.05s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .wrongnote{font-size:.78rem; color:var(--dim); margin:30px auto 0; max-width:500px; line-height:1.7;}
  .wrongnote s{color:var(--mint-deep); text-decoration-thickness:1px;}

  .marquee{margin-top:50px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); overflow:hidden; white-space:nowrap; padding:12px 0;}
  .marquee .track{display:inline-block; animation:scroll 26s linear infinite;}
  .marquee span{font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 22px;}
  .marquee span b{color:var(--mint-deep); font-weight:600;}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .stats{display:flex; gap:0; margin-top:0; border-bottom:1px solid var(--line);}
  .stat{flex:1; padding:24px 12px; text-align:center; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat b{display:block; font-size:1.8rem; font-weight:600; line-height:1; letter-spacing:-.02em;}
  .stat span{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:8px; display:block;}
  .stat .pct-wrong{color:var(--mint-deep);}

  section{padding:76px 0 0;}
  .sec-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.16em; color:var(--dim); margin-bottom:28px; display:flex; align-items:center; gap:10px;}
  .sec-label::before{content:""; width:18px; height:1px; background:var(--mint-deep);}

  .reveal{opacity:0; transform:translateY(24px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1; transform:none;}

  .registry{display:flex; flex-direction:column;}
  .row{display:grid; grid-template-columns:88px 1fr auto; gap:20px; align-items:center;
    padding:26px 4px; border-top:1px solid var(--line); position:relative; transition:background .25s, padding-left .25s;}
  .registry .row:last-child{border-bottom:1px solid var(--line);}
  a.row::after{content:"→"; position:absolute; right:6px; top:50%; transform:translateY(-50%) translateX(-8px); opacity:0; color:var(--mint-deep); font-size:1.1rem; transition:opacity .25s, transform .25s;}
  a.row:hover{background:linear-gradient(90deg, var(--mint-soft), transparent); padding-left:14px;}
  a.row:hover .st{opacity:0;}
  a.row:hover::after{opacity:1; transform:translateY(-50%) translateX(0);}
  .row .serial{font-size:.72rem; color:var(--dim); letter-spacing:.03em;}
  .row .name{font-size:1.3rem; font-weight:600; letter-spacing:-.02em;}
  .row .name b{color:var(--mint-deep); font-weight:600;}
  .row .credit{font-size:.68rem; color:var(--dim); margin-top:3px;}
  .row .desc{font-size:.88rem; color:#6A706C; margin-top:8px; line-height:1.55; max-width:470px;}
  .row .st{font-size:.72rem; font-weight:500; color:var(--dim); white-space:nowrap; display:flex; align-items:center; gap:7px; transition:opacity .25s;}
  .row .st .dot{width:7px; height:7px; border-radius:50%; background:var(--dim);}
  .st.live{color:var(--mint-deep);}
  .st.live .dot{background:var(--mint-deep); box-shadow:0 0 0 0 rgba(63,185,138,.5); animation:ping 2s ease infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,185,138,.5)}70%{box-shadow:0 0 0 7px rgba(63,185,138,0)}100%{box-shadow:0 0 0 0 rgba(63,185,138,0)}}
  .row.nextrow .name{color:var(--dim); font-weight:500;}

  .panel{border:1px solid var(--line); border-radius:16px; padding:32px; max-width:640px; background:#fff; transition:box-shadow .3s, transform .3s;}

  .panel .th{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:14px;}
  .panel h3{font-size:1.18rem; font-weight:600; line-height:1.35; margin-bottom:10px; letter-spacing:-.02em;}
  .panel p{font-size:.94rem; color:#6A706C; line-height:1.6;}
  .panel .sig{margin-top:18px; font-size:.74rem; color:var(--dim);}
  .panel input, .panel textarea{background:var(--bg); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.92rem; padding:12px 14px; border-radius:10px; outline:none; transition:border-color .2s, box-shadow .2s;}
  .panel input:focus, .panel textarea:focus{border-color:var(--mint-deep); box-shadow:0 0 0 3px var(--mint-soft);}
  .panel .btn{border:none; padding:12px 22px; font-family:inherit; font-weight:500; font-size:.88rem; border-radius:10px;
    cursor:pointer; color:var(--ink); background:var(--mint); transition:background .2s, transform .1s, box-shadow .2s;}
  .panel .btn:hover{background:var(--mint-deep); color:#fff; box-shadow:0 8px 20px -8px var(--mint-deep);}
  .panel .btn:active{transform:translateY(1px);}

  .mani{font-size:clamp(1.3rem,3.2vw,1.75rem); font-weight:500; line-height:1.5; max-width:680px; letter-spacing:-.02em; color:#2A2E2C;}
  .mani em{font-style:normal; color:var(--mint-deep); font-weight:600;}
  .mani .g{color:var(--mint-deep); font-weight:600;}

  footer{margin-top:90px; border-top:1px solid var(--line);}
  .fwrap{padding:34px 0 60px; font-size:.76rem; color:var(--dim); line-height:1.9;}
  .fwrap s{color:var(--mint-deep);}
  .upside{display:inline-block; transform:rotate(180deg);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .reveal{opacity:1; transform:none;}
  }
</style>
</head>

function renderRegistry(){

// ====== ANIMACIONES ======
let io;
function countUp(el){
  const target = +el.getAttribute("data-count");
  const suffix = el.getAttribute("data-suffix") || "";
  const dur = 900; const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(target*eased) + suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function observeReveals(){
  if(!io){
    io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add("in");
          if(e.target.querySelectorAll) e.target.querySelectorAll("[data-count]").forEach(countUp);
          if(e.target.hasAttribute && e.target.hasAttribute("data-count")) countUp(e.target);
          io.unobserve(e.target);
        }
      });
    }, {threshold:.15});
  }
  document.querySelectorAll(".reveal:not(.in)").forEach(el=>io.observe(el));
  document.querySelectorAll(".stat b[data-count]").forEach(el=>io.observe(el));
}

// typewriter rotator — cicla los productos
let twTimer;
function startTypewriter(){
  clearTimeout(twTimer);
  const el = document.getElementById("rot");
  if(!el) return;
  const words = T[LANG].rotWords;
  let wi=0, ci=0, deleting=false;
  (function tick(){
    const w = words[wi];
    if(!deleting){
      ci++; el.textContent = w.slice(0,ci);
      if(ci===w.length){ deleting=true; twTimer=setTimeout(tick,1700); return; }
      twTimer=setTimeout(tick, 42);
    } else {
      ci--; el.textContent = w.slice(0,ci);
      if(ci<=0){ deleting=false; wi=(wi+1)%words.length; twTimer=setTimeout(tick,320); return; }
      twTimer=setTimeout(tick, 22);
    }
  })();
}

window.addEventListener("scroll", ()=>{
  const h = document.documentElement;
  const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("nav").classList.toggle("scrolled", h.scrollTop > 20);
}, {passive:true});

setLang(LANG);
observeReveals();
</script>
