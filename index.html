<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFDF9; --ink:#141414; --dim:#7C8A83;
    --mint:#8CE7C0; --mint-deep:#5FD3A3; --line:#141414;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  ::selection{background:var(--mint); color:var(--ink);}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55; font-size:16px; font-weight:400;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:900px; margin:0 auto; padding:0 26px;}

  /* NAV */
  nav{display:flex; justify-content:space-between; align-items:center; padding:22px 0; flex-wrap:wrap; gap:14px;}
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:64px; height:auto; display:block;}
  .logo .wordmark{font-weight:600; font-size:1.15rem; line-height:1;}
  .logo .wordmark small{display:block; font-size:1.5rem; font-weight:700; margin-top:-2px;}
  .navright{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .sys{font-size:.72rem; color:var(--dim); font-weight:500;}
  .sys .ok{color:var(--mint-deep); font-weight:600;}
  .langbtn{
    background:var(--mint); border:2.5px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.78rem; font-weight:600; border-radius:999px;
    padding:6px 16px; cursor:pointer; box-shadow:2px 2px 0 var(--line); transition:transform .08s, box-shadow .08s;
  }
  .langbtn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--line);}

  /* HERO */
  .hero{padding:70px 0 50px; text-align:center;}
  .heroLogo{width:210px; max-width:70%; height:auto; margin:0 auto 8px;}
  .proto-label{font-size:.78rem; color:var(--dim); font-weight:500; letter-spacing:.02em;}
  h1{
    font-size:clamp(2.6rem,9vw,4.8rem); font-weight:700; letter-spacing:-.015em;
    line-height:1.02; margin:12px 0 8px;
  }
  h1 .flip{display:inline-block; min-width:1.05em; color:var(--mint-deep);}
  .tag{font-size:1.1rem; color:#40534A; max-width:600px; margin:16px auto 0;}
  .tag em{font-style:normal; color:var(--ink); font-weight:600;}
  .cursor{display:inline-block; width:.55em; height:1.05em; background:var(--mint-deep); vertical-align:text-bottom; border-radius:2px; animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .wrongnote{font-size:.78rem; color:var(--dim); margin:22px auto 0; max-width:520px; font-weight:400;}
  .wrongnote s{color:var(--mint-deep);}

  /* STATS */
  .stats{display:flex; gap:14px; margin-top:44px; flex-wrap:wrap; justify-content:center;}
  .stat{
    flex:1; min-width:130px; max-width:200px; padding:18px 16px; text-align:center;
    background:var(--panel); border:2.5px solid var(--line); border-radius:20px; box-shadow:4px 4px 0 var(--line);
  }
  .stat b{display:block; font-size:1.8rem; font-weight:700; line-height:1; color:var(--ink);}
  .stat span{font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); font-weight:500;}
  .stat.tilt{transform:rotate(-2deg);}
  .stat .pct-wrong{color:var(--mint-deep);}

  /* SECTIONS */
  section{padding:66px 0 0;}
  h2{
    font-size:1.6rem; font-weight:700; letter-spacing:-.01em; margin-bottom:26px;
    display:inline-block;
  }
  h2::before{content:"// "; color:var(--mint-deep);}

  /* REGISTRY */
  .registry{display:flex; flex-direction:column; gap:16px;}
  .row{
    display:grid; grid-template-columns:96px 1fr auto; gap:18px; align-items:center;
    padding:22px 22px; background:var(--panel); border:2.5px solid var(--line);
    border-radius:22px; box-shadow:5px 5px 0 var(--line);
    transition:transform .1s, box-shadow .1s;
  }
  a.row:hover{transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--line);}
  .row .serial{font-size:.72rem; color:var(--dim); font-weight:500;}
  .row .name{font-size:1.4rem; font-weight:700; letter-spacing:-.01em;}
  .row .name b{color:var(--mint-deep); font-weight:700;}
  .row .credit{font-size:.68rem; color:var(--dim); margin-top:4px; font-weight:400;}
  .row .desc{font-size:.86rem; color:#4A5A52; margin-top:4px;}
  .row .st{font-size:.7rem; font-weight:600; white-space:nowrap; border:2px solid var(--line); border-radius:999px; padding:4px 12px;}
  .st.live{background:var(--mint); color:var(--ink);}
  .st.dev{background:#F0EEE8; color:var(--dim);}
  .row.wrongrow{transform:rotate(.7deg);}
  a.row.wrongrow:hover{transform:rotate(.7deg) translate(-2px,-2px);}
  .row.nextrow{border-style:dashed; box-shadow:none; background:transparent;}
  .row.nextrow .name{color:var(--dim);}
  .upside{display:inline-block; transform:rotate(180deg);}

  /* PANELS (press / sub / idea) */
  .trans{background:var(--panel); border:2.5px solid var(--line); border-radius:24px; box-shadow:5px 5px 0 var(--line); padding:30px; max-width:700px;}
  .trans .th{font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mint-deep); font-weight:600; margin-bottom:12px;}
  .trans h3{font-size:1.3rem; font-weight:700; line-height:1.3; margin-bottom:10px;}
  .trans p{font-size:.92rem; color:#4A5A52;}
  .trans .sig{margin-top:16px; font-size:.72rem; color:var(--dim);}
  .trans .sig::before{content:"🍦 ";}
  .trans input, .trans textarea{
    background:#fff; border:2.5px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.92rem; padding:12px 14px; border-radius:14px;
  }
  .trans .btn{
    border:2.5px solid var(--line); padding:12px 22px; font-family:inherit; font-weight:600;
    font-size:.85rem; border-radius:999px; cursor:pointer; color:var(--ink);
    box-shadow:3px 3px 0 var(--line); transition:transform .08s, box-shadow .08s;
  }
  .trans .btn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--line);}

  /* MANIFESTO */
  .mani{font-size:clamp(1.3rem,3.6vw,1.9rem); font-weight:600; line-height:1.4; max-width:720px;}
  .mani em{font-style:normal; color:var(--mint-deep); font-weight:700;}
  .mani .g{color:var(--mint-deep); font-weight:700;}

  footer{margin-top:80px; border-top:2.5px solid var(--line);}
  .fwrap{padding:28px 0 56px; font-size:.74rem; color:var(--dim); line-height:1.8;}
  .fwrap s{color:var(--mint-deep);}
</style>
</head>

// ====== IDIOMA ======
let LANG = (function(){ try { return localStorage.getItem("grong-lang") || "es"; } catch(e){ return "es"; } })();

function applyTexts(){
  const t = T[LANG];
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if(t[k] !== undefined) el.innerHTML = t[k];
  });
  document.querySelectorAll("[data-t-placeholder]").forEach(el=>{
    const k = el.getAttribute("data-t-placeholder");
    if(t[k] !== undefined) el.placeholder = t[k];
  });
  document.title = t.title;
  document.documentElement.lang = LANG;
  document.getElementById("langBtn").textContent = LANG === "es" ? "EN" : "ES";
}

function renderRegistry(){
  const t = T[LANG];
  const reg = document.getElementById("registry");
  reg.innerHTML = "";
  GRONGIDEAS.forEach(g=>{
    const el = document.createElement(g.link ? "a" : "div");
    if(g.link) el.href = g.link;
    el.className = "row" + (g.wrong ? " wrongrow" : "");
    el.innerHTML =
      '<div class="serial">'+g.serial+'</div>'+
      '<div><div class="name">'+g.name+'<b>'+g.accent+'</b></div><div class="credit">imagined by the grong co.</div><div class="desc">'+g.desc[LANG]+'</div></div>'+
      '<div class="st '+g.status+'">'+(g.status==="live" ? t.stLive : t.stDev)+'</div>';
    reg.appendChild(el);
  });
  const nx = document.createElement("div");
  nx.className = "row nextrow";
  nx.innerHTML =
    '<div class="serial">GRONG-'+String(GRONGIDEAS.length+1).padStart(3,"0")+'</div>'+
    '<div><div class="name">???</div><div class="desc">'+t.nextDesc+'</div></div>'+
    '<div class="st dev">'+t.stNext+'</div>';
  reg.appendChild(nx);
}

function renderStats(){
  const t = T[LANG];
  const live = GRONGIDEAS.filter(g=>g.status==="live").length;
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>'+GRONGIDEAS.length+'</b><span>'+t.statIdeas+'</span></div>'+
    '<div class="stat"><b>'+live+'</b><span>'+t.statProd+'</span></div>'+
    '<div class="stat"><b>0</b><span>'+t.statReq+'</span></div>'+
    '<div class="stat tilt"><b class="pct-wrong">104%</b><span>'+t.statDeploy+'</span></div>';
}

function setLang(l){
  LANG = l;
  try { localStorage.setItem("grong-lang", l); } catch(e){}
  applyTexts(); renderRegistry(); renderStats();
}
function toggleLang(){ setLang(LANG === "es" ? "en" : "es"); }

  if(!em || !em.includes("@")) return;
  window.location.href = "mailto:hey@wirdolab.com?subject=" + encodeURIComponent(t.subject_sub + em) +
    "&body=" + encodeURIComponent(t.body_sub);
  document.getElementById("subMsg").style.display = "block";
}
function submitIdea(){
  const t = T[LANG];
  const idea = document.getElementById("ideaBox").value.trim();
  if(!idea) return;
  window.location.href = "mailto:hey@wirdolab.com?subject=" + encodeURIComponent(t.subject_idea) +
    "&body=" + encodeURIComponent("Idea:\n" + idea + "\n\n" + t.body_idea);
  document.getElementById("ideaMsg").style.display = "block";
}

setLang(LANG);

// wordmark: se equivoca cada tanto — grong ⇄ wrong
const flip = document.getElementById("flip");
const seq = ["grong","wrong","wro—","grong"];
let i = 0;
setInterval(()=>{
  i = (i+1) % seq.length;
  flip.textContent = seq[i];
  flip.style.color = "var(--mint-deep)";
}, 1800);
</script>
