<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheGrongProtocol — not wrong. grong.</title>
<meta name="description" content="El sistema central de TheGrongCo. Cosas que nadie pidió, hechas con IA.">
<style>
  :root{
    --bg:#FAF6F0; --ink:#161616; --dim:#8B857A; --line:#E4DDD1;
    --red:#FF3B30; --green:#0E9F4E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  ::selection{background:var(--red); color:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    line-height:1.6; font-size:15px;
    background-image:linear-gradient(var(--line) 1px, transparent 1px);
    background-size:100% 96px;
  }
  a{color:inherit;}
  .wrap{max-width:880px; margin:0 auto; padding:0 28px;}

  /* NAV */
  nav{display:flex; justify-content:space-between; align-items:center; padding:26px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px;}
  .brand{font-weight:700; letter-spacing:.02em;}
  .brand b{color:var(--red); font-weight:700;}
  .navright{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .sys{font-size:.68rem; color:var(--dim); letter-spacing:.18em; text-transform:uppercase;}
  .sys .ok{color:var(--green);}
  .langbtn{
    background:none; border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.68rem; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; padding:6px 12px; cursor:pointer; transition:border-color .15s;
  }
  .langbtn:hover{border-color:var(--red); color:var(--red);}

  /* HERO */
  .hero{padding:110px 0 70px;}
  .proto-label{font-size:.68rem; letter-spacing:.34em; text-transform:uppercase; color:var(--dim);}
  h1{
    font-size:clamp(2.4rem,8.5vw,4.6rem); font-weight:700; letter-spacing:-.03em;
    line-height:1.05; margin:18px 0 8px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  h1 .flip{display:inline-block; min-width:1.1em;}
  .tag{font-size:1.05rem; color:var(--dim); max-width:560px; margin-top:18px;}
  .tag em{font-style:normal; color:var(--ink);}
  .cursor{display:inline-block; width:.6em; height:1.1em; background:var(--green); vertical-align:text-bottom; animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .wrongnote{font-size:.68rem; color:var(--dim); margin-top:26px; letter-spacing:.06em;}
  .wrongnote s{color:var(--red);}

  /* STATS */
  .stats{display:flex; gap:0; margin-top:60px; border:1px solid var(--line); flex-wrap:wrap;}
  .stat{flex:1; min-width:140px; padding:18px 20px; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat b{display:block; font-size:1.5rem; font-weight:700; color:var(--ink);}
  .stat span{font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);}
  .stat.tilt{transform:rotate(-1.2deg); background:var(--bg); border:1px solid var(--line); margin:-1px;}
  .stat .pct-wrong{color:var(--green);}

  /* SECTIONS */
  section{padding:70px 0 0;}
  h2{font-size:.68rem; font-weight:400; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); margin-bottom:34px;}
  h2::before{content:"// "; color:var(--red);}

  /* REGISTRY */
  .registry{border-top:1px solid var(--line);}
  .row{
    display:grid; grid-template-columns:110px 1fr auto; gap:18px; align-items:baseline;
    padding:26px 4px; border-bottom:1px solid var(--line); text-decoration:none;
    transition:background .15s, padding-left .15s;
  }
  .row:hover{background:#F2ECE2; padding-left:14px;}
  .row .serial{font-size:.68rem; color:var(--dim); letter-spacing:.12em;}
  .row .name{font-size:1.25rem; font-weight:700; letter-spacing:-.01em; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .row .name b{color:var(--red); font-weight:700;}
  .row .desc{font-size:.8rem; color:var(--dim); margin-top:6px; max-width:520px;}
  .row .st{font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; white-space:nowrap;}
  .st.live{color:var(--green);}
  .st.dev{color:var(--ink); opacity:.55;}
  .row.wrongrow{transform:rotate(.6deg);}
  .row.nextrow .name{color:var(--dim);}
  .row.nextrow{border-bottom-style:dashed;}
  .upside{display:inline-block; transform:rotate(180deg);}

  /* TRANSMISSION */
  .trans{border:1px solid var(--line); padding:30px; max-width:680px;}
  .trans .th{font-size:.62rem; letter-spacing:.22em; text-transform:uppercase; color:var(--green); margin-bottom:14px;}
  .trans h3{font-size:1.15rem; font-weight:700; line-height:1.4; margin-bottom:12px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .trans p{font-size:.82rem; color:var(--dim);}
  .trans .sig{margin-top:16px; font-size:.68rem; color:var(--dim);}
  .trans .sig::before{content:"> ";}
  .trans input, .trans textarea{
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.85rem; padding:12px;
  }
  .trans .btn{
    border:none; padding:12px 22px; font-family:inherit; font-weight:700;
    font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; color:#fff;
  }

  /* MANIFESTO */
  .mani{font-size:clamp(1.15rem,3.4vw,1.7rem); font-weight:700; line-height:1.45; max-width:700px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; letter-spacing:-.01em;}
  .mani em{font-style:normal; color:var(--red);}
  .mani .g{color:var(--green);}

  footer{border-top:1px solid var(--line); margin-top:90px;}
  .fwrap{padding:30px 0 60px; font-size:.68rem; color:var(--dim); line-height:1.9;}
  .fwrap s{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <div class="brand">TheGrong<b>Co.</b></div>
    <div class="navright">
      <div class="sys" data-t="sys"></div>
      <button class="langbtn" id="langBtn" onclick="toggleLang()">EN</button>
    </div>
  </nav>

  <header class="hero">
    <div class="proto-label" data-t="protoLabel"></div>
    <h1>The<span class="flip" id="flip">Grong</span>Protocol</h1>
    <p class="tag" data-t="tag"></p>
    <p class="wrongnote" data-t="wrongnote"></p>
    <div class="stats" id="stats"></div>
  </header>

  <section>
    <h2 data-t="hRegistry"></h2>
    <div class="registry" id="registry"></div>
  </section>

  <section>
    <h2 data-t="hTrans"></h2>
    <div class="trans">
      <div class="th" data-t="pressTh"></div>
      <h3 data-t="pressTitle"></h3>
      <p data-t="pressBody"></p>
      <p class="sig" data-t="pressSig"></p>
    </div>
  </section>

  <section>
    <h2 data-t="hSub"></h2>
    <div class="trans" style="max-width:680px;">
      <div class="th" data-t="subTh"></div>
      <h3 data-t="subTitle"></h3>
      <p data-t="subBody"></p>
      <!-- NEWSLETTER_EMBED: reemplazar este bloque con el embed de Buttondown/Substack cuando exista la cuenta -->
      <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
        <input id="subEmail" type="email" data-t-placeholder="subPh" style="flex:1; min-width:200px;">
        <button onclick="subscribe()" class="btn" style="background:var(--green);" data-t="subBtn"></button>
      </div>
      <p class="sig" id="subMsg" style="display:none;" data-t="subMsg"></p>
    </div>
  </section>

  <section>
    <h2 data-t="hIdea"></h2>
    <div class="trans" style="max-width:680px;">
      <div class="th" data-t="ideaTh"></div>
      <h3 data-t="ideaTitle"></h3>
      <p data-t="ideaBody"></p>
      <textarea id="ideaBox" rows="3" data-t-placeholder="ideaPh" style="width:100%; margin-top:16px; resize:vertical;"></textarea>
      <button onclick="submitIdea()" class="btn" style="margin-top:12px; background:var(--red);" data-t="ideaBtn"></button>
      <p class="sig" id="ideaMsg" style="display:none;" data-t="ideaMsg"></p>
    </div>
  </section>

  <section>
    <h2 data-t="hMani"></h2>
    <p class="mani" data-t="mani"></p>
  </section>

</div>

<footer>
  <div class="wrap fwrap" data-t="footer"></div>
</footer>

<script>

    footer: 'TheGrongCo. © 2026 · All rights <s>reserved</s> wronged. · everything here: imagined by TheGrongCo.<br>TheGrongProtocol is the central system of the conglomerate. This site also counts as a product: GRONG-000-B.<br>contact: hey@wirdolab.com · complaints: <span class="upside">into the void, with confidence</span> · local time: incorrect',

};

// ====== REGISTRO — agregar una grongidea = agregar un objeto aquí ======
const GRONGIDEAS = [
  {
    serial:"GRONG-001",
    name:"TheGrong", accent:"Match",
    desc:{
      es:"Matching por red flags. Certifica tus banderas rojas, encuentra gente igual de intensa y rompe el hielo con tus propios traumas. Precisión del 4%, honestidad del 100%.",
      en:"Matching by red flags. Get your red flags certified, find people just as intense as you, and break the ice with your own traumas. 4% accuracy, 100% honesty."

    status:"live",
    link:"red-flag-tester.html",
    wrong:false
  },
  {
    serial:"GRONG-OO2", // sí, con letras O. no es error. bueno, sí. pero no.
    name:"TheGrong", accent:"Web",
    desc:{

    status:"live",
    link:"https://wirdolab.github.io/thegrongweb/",
    wrong:true // esta fila está ligeramente chueca a propósito
  },
  {
    serial:"GRONG-003",
    name:"TheGrong", accent:"Ex",
    desc:{
      es:"Tu historial romántico en formato recap anual. Las estadísticas que nadie pidió sobre gente que ya no está. Cierra ciclos, ábrelos otra vez, compártelos.",
      en:"Your romantic history as a yearly recap. The stats nobody asked for about people who are no longer around. Close cycles, reopen them, share them."
    },
    status:"live",
    link:"thegrongex.html",
    wrong:false
  },
  {
    serial:"GRONG-004",
    name:"TheGrong", accent:"Call",
    desc:{
      es:"Botón de pánico que finge una llamada de emergencia entrante (voz + vibración) para sacarte de cualquier situación social incómoda. Timer de 1 a 30 min o custom. EN/ES.",
      en:"A panic button that fakes an incoming emergency call (voice + vibration) to get you out of any awkward social situation. 1–30 min timer or custom. EN/ES."
    },
    status:"live",
    link:"thegrongcall.html",
    wrong:false
  },
  {
    serial:"GRONG-005",
    name:"TheGrong", accent:"Sugar",
    desc:{
      es:"Sugar dating con más papeleo que un trámite migratorio: verificación de identidad, videollamada grabada obligatoria antes de conocerse en persona, y un botón de pánico que probablemente uses más que el match. El amor(ish), pero auditado.",

    },
    status:"live",
    link:"thegrongsugar.html",
    wrong:false
  }

// ====== ESTADO DE IDIOMA ======
let LANG = (function(){
  try { return localStorage.getItem("grong-lang") || "es"; } catch(e){ return "es"; }
})();

function applyTexts(){
  const t = T[LANG];
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if(t[k] !== undefined) el.innerHTML = t[k];
  });
  document.querySelectorAll("[data-t-placeholder]").forEach(el=>{
    const k = el.getAttribute("data-t-placeholder");
    if(t[k] !== undefined) el.placeholder = t[k];
  });
  document.title = t.title;
  document.documentElement.lang = LANG;
  document.getElementById("langBtn").textContent = LANG === "es" ? "EN" : "ES";
}

function renderRegistry(){
  const t = T[LANG];
  const reg = document.getElementById("registry");
  reg.innerHTML = "";
  GRONGIDEAS.forEach(g=>{
    const el = document.createElement(g.link ? "a" : "div");
    if(g.link) el.href = g.link;
    el.className = "row" + (g.wrong ? " wrongrow" : "");
    el.innerHTML =
      '<div class="serial">'+g.serial+'</div>'+
      '<div><div class="name">'+g.name+'<b>'+g.accent+'</b></div><div class="desc">'+g.desc[LANG]+'</div><div class="serial" style="margin-top:8px">imagined by TheGrongCo.</div></div>'+
      '<div class="st '+g.status+'">'+(g.status==="live" ? t.stLive : t.stDev)+'</div>';
    reg.appendChild(el);
  });
  const nx = document.createElement("div");
  nx.className = "row nextrow";
  nx.innerHTML =
    '<div class="serial">GRONG-'+String(GRONGIDEAS.length+1).padStart(3,"0")+'</div>'+
    '<div><div class="name">???</div><div class="desc">'+t.nextDesc+'</div></div>'+
    '<div class="st dev">'+t.stNext+'</div>';
  reg.appendChild(nx);
}

function renderStats(){
  const t = T[LANG];
  const live = GRONGIDEAS.filter(g=>g.status==="live").length;
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>'+GRONGIDEAS.length+'</b><span>'+t.statIdeas+'</span></div>'+
    '<div class="stat"><b>'+live+'</b><span>'+t.statProd+'</span></div>'+
    '<div class="stat"><b>0</b><span>'+t.statReq+'</span></div>'+
    '<div class="stat tilt"><b class="pct-wrong">104%</b><span>'+t.statDeploy+'</span></div>';
}

function setLang(l){
  LANG = l;
  try { localStorage.setItem("grong-lang", l); } catch(e){}
  applyTexts();
  renderRegistry();
  renderStats();
}

function toggleLang(){ setLang(LANG === "es" ? "en" : "es"); }

// ====== ACCIONES ======
function subscribe(){
  const t = T[LANG];
  const em = document.getElementById("subEmail").value.trim();
  if(!em || !em.includes("@")) return;
  window.location.href = "mailto:hey@wirdolab.com?subject=" + encodeURIComponent(t.subject_sub + em) +
    "&body=" + encodeURIComponent(t.body_sub);
  document.getElementById("subMsg").style.display = "block";
}

function submitIdea(){
  const t = T[LANG];
  const idea = document.getElementById("ideaBox").value.trim();
  if(!idea) return;
  window.location.href = "mailto:hey@wirdolab.com?subject=" + encodeURIComponent(t.subject_idea) +
    "&body=" + encodeURIComponent("Idea:\n" + idea + "\n\n" + t.body_idea);
  document.getElementById("ideaMsg").style.display = "block";
}

// ====== INIT ======
setLang(LANG);

// wordmark: se equivoca cada tanto — Wrong → Grong, corregido en vivo
const flip = document.getElementById("flip");
const seq = ["Grong","Wrong","Wro—","Grong"];
let i = 0;
setInterval(()=>{
  i = (i+1) % seq.length;
  flip.textContent = seq[i];
  flip.style.color = seq[i].startsWith("W") ? "var(--red)" : "";
}, 1800);
</script>
</body>
</html>
