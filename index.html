<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the grong co. — not wrong. grong.</title>
<meta name="description" content="El sistema central de the grong co. Cosas que nadie pidió, hechas con IA.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFCFB; --ink:#181A19; --dim:#8A8F8C; --faint:#EDEDEA;
    --mint:#8CE7C0; --mint-deep:#3FB98A; --line:#E7E7E3;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  ::selection{background:var(--mint); color:var(--ink);}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.6; font-size:16px; font-weight:400; letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:820px; margin:0 auto; padding:0 28px;}

  /* NAV */
  nav{display:flex; justify-content:space-between; align-items:center; padding:28px 0; flex-wrap:wrap; gap:14px;}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo .mark{width:40px; height:40px; display:flex; align-items:center; justify-content:center;}
  .logo .mark img, .logo .mark svg{width:100%; height:100%; object-fit:contain; display:block;}
  .logo .wordmark{font-weight:600; font-size:1.02rem; letter-spacing:-.02em;}
  .navright{display:flex; align-items:center; gap:18px;}
  .sys{font-size:.74rem; color:var(--dim);}
  .sys .ok{color:var(--mint-deep); font-weight:500;}
  .langbtn{
    background:none; border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.74rem; font-weight:500; border-radius:8px;
    padding:6px 13px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  .langbtn:hover{border-color:var(--mint-deep); color:var(--mint-deep);}

  /* HERO */
  .hero{padding:90px 0 60px; text-align:center;}
  .heroLogo{width:132px; height:132px; margin:0 auto 30px; display:flex; align-items:center; justify-content:center;}
  .heroLogo img, .heroLogo svg{width:100%; height:100%; object-fit:contain;}
  .proto-label{font-size:.74rem; color:var(--dim); text-transform:uppercase; letter-spacing:.14em;}
  h1{
    font-size:clamp(2.4rem,7vw,3.6rem); font-weight:600; letter-spacing:-.03em;
    line-height:1.05; margin:16px 0 0;
  }
  h1 .flip{display:inline-block; min-width:2.4em; text-align:left; color:var(--mint-deep);}
  .tag{font-size:1.12rem; color:#545956; max-width:540px; margin:22px auto 0; line-height:1.6;}
  .tag em{font-style:normal; color:var(--ink); font-weight:500;}
  .cursor{display:inline-block; width:2px; height:1.05em; background:var(--mint-deep); vertical-align:text-bottom; animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .wrongnote{font-size:.78rem; color:var(--dim); margin:30px auto 0; max-width:500px; line-height:1.7;}
  .wrongnote s{color:var(--mint-deep); text-decoration-thickness:1px;}

  /* STATS */
  .stats{display:flex; gap:0; margin-top:54px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .stat{flex:1; padding:22px 12px; text-align:center; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat b{display:block; font-size:1.7rem; font-weight:600; line-height:1; letter-spacing:-.02em;}
  .stat span{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:7px; display:block;}
  .stat .pct-wrong{color:var(--mint-deep);}

  /* SECTIONS */
  section{padding:76px 0 0;}
  .sec-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.16em; color:var(--dim); margin-bottom:30px; display:flex; align-items:center; gap:10px;}
  .sec-label::before{content:""; width:18px; height:1px; background:var(--mint-deep);}

  /* REGISTRY */
  .registry{display:flex; flex-direction:column;}
  .row{
    display:grid; grid-template-columns:92px 1fr auto; gap:22px; align-items:center;
    padding:26px 4px; border-top:1px solid var(--line); transition:background .2s;
  }
  .registry .row:last-child{border-bottom:1px solid var(--line);}
  a.row:hover{background:#F6F6F3;}
  .row .serial{font-size:.72rem; color:var(--dim); letter-spacing:.03em;}
  .row .name{font-size:1.3rem; font-weight:600; letter-spacing:-.02em;}
  .row .name b{color:var(--mint-deep); font-weight:600;}
  .row .credit{font-size:.68rem; color:var(--dim); margin-top:3px;}
  .row .desc{font-size:.88rem; color:#6A706C; margin-top:8px; line-height:1.55; max-width:480px;}
  .row .st{font-size:.72rem; font-weight:500; color:var(--dim); white-space:nowrap; display:flex; align-items:center; gap:7px;}
  .row .st .dot{width:7px; height:7px; border-radius:50%; background:var(--dim);}
  .st.live{color:var(--mint-deep);}
  .st.live .dot{background:var(--mint-deep);}
  .row.nextrow .name{color:var(--dim); font-weight:500;}

  /* PANELS */
  .panel{border:1px solid var(--line); border-radius:16px; padding:32px; max-width:640px; background:#fff;}
  .panel .th{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:14px;}
  .panel h3{font-size:1.18rem; font-weight:600; line-height:1.35; margin-bottom:10px; letter-spacing:-.02em;}
  .panel p{font-size:.94rem; color:#6A706C; line-height:1.6;}
  .panel .sig{margin-top:18px; font-size:.74rem; color:var(--dim);}
  .panel input, .panel textarea{
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.92rem; padding:12px 14px; border-radius:10px; outline:none; transition:border-color .2s;
  }
  .panel input:focus, .panel textarea:focus{border-color:var(--mint-deep);}
  .panel .btn{
    border:none; padding:12px 22px; font-family:inherit; font-weight:500;
    font-size:.88rem; border-radius:10px; cursor:pointer; color:var(--ink);
    background:var(--mint); transition:background .2s, transform .08s;
  }
  .panel .btn:hover{background:var(--mint-deep); color:#fff;}
  .panel .btn:active{transform:translateY(1px);}

  /* MANIFESTO */
  .mani{font-size:clamp(1.3rem,3.2vw,1.75rem); font-weight:500; line-height:1.5; max-width:680px; letter-spacing:-.02em; color:#2A2E2C;}
  .mani em{font-style:normal; color:var(--mint-deep); font-weight:600;}
  .mani .g{color:var(--mint-deep); font-weight:600;}

  footer{margin-top:90px; border-top:1px solid var(--line);}
  .fwrap{padding:34px 0 60px; font-size:.76rem; color:var(--dim); line-height:1.9;}
  .fwrap s{color:var(--mint-deep);}
  .upside{display:inline-block; transform:rotate(180deg);}
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a class="logo" href="./">
      <span class="mark" id="navLogo"></span>
      <span class="wordmark">the grong co.</span>
    </a>
    <div class="navright">
      <div class="sys" data-t="sys"></div>
      <button class="langbtn" id="langBtn" onclick="toggleLang()">EN</button>
    </div>
  </nav>

  <header class="hero">
    <div class="heroLogo" id="heroLogo"></div>
    <div class="proto-label" data-t="protoLabel"></div>
    <h1>not <span class="flip" id="flip">grong</span></h1>
    <p class="tag" data-t="tag"></p>
    <p class="wrongnote" data-t="wrongnote"></p>
    <div class="stats" id="stats"></div>
  </header>

  <section>
    <div class="sec-label" data-t="hRegistry"></div>
    <div class="registry" id="registry"></div>
  </section>

  <section>
    <div class="sec-label" data-t="hTrans"></div>
    <div class="panel">
      <div class="th" data-t="pressTh"></div>
      <h3 data-t="pressTitle"></h3>
      <p data-t="pressBody"></p>
      <p class="sig" data-t="pressSig"></p>
    </div>
  </section>

  <section>
    <div class="sec-label" data-t="hSub"></div>
    <div class="panel">
      <div class="th" data-t="subTh"></div>
      <h3 data-t="subTitle"></h3>
      <p data-t="subBody"></p>
      <!-- NEWSLETTER_EMBED: reemplazar por embed de Buttondown/Substack cuando exista la cuenta -->
      <div style="display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;">
        <input id="subEmail" type="email" data-t-placeholder="subPh" style="flex:1; min-width:200px;">
        <button onclick="subscribe()" class="btn" data-t="subBtn"></button>
      </div>
      <p class="sig" id="subMsg" style="display:none;" data-t="subMsg"></p>
    </div>
  </section>

  <section>
    <div class="sec-label" data-t="hIdea"></div>
    <div class="panel">
      <div class="th" data-t="ideaTh"></div>
      <h3 data-t="ideaTitle"></h3>
      <p data-t="ideaBody"></p>
      <textarea id="ideaBox" rows="3" data-t-placeholder="ideaPh" style="width:100%; margin-top:18px; resize:vertical;"></textarea>
      <button onclick="submitIdea()" class="btn" style="margin-top:12px;" data-t="ideaBtn"></button>
      <p class="sig" id="ideaMsg" style="display:none;" data-t="ideaMsg"></p>
    </div>
  </section>

  <section>
    <div class="sec-label" data-t="hMani"></div>
    <p class="mani" data-t="mani"></p>
  </section>

</div>

<footer>
  <div class="wrap fwrap" data-t="footer"></div>
</footer>

<script>
// ====== LOGO — usa logo.png si existe (súbelo al repo); si no, SVG de respaldo ======
const LOGO_SVG = '<svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">'+
  '<g fill="#8CE7C0" stroke="#181A19" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">'+
  '<path d="M60 176 C34 172 30 200 58 202 C82 204 96 190 122 194 C150 198 176 204 208 198 C230 194 244 200 254 190 C264 180 252 168 232 170 C206 172 130 170 108 170 C86 170 82 179 60 176 Z"/>'+

  '<path d="M150 44 C145 36 154 30 162 35 L196 128 C178 150 148 148 136 124 Z"/>'+
  '</g>'+
  '<g stroke="#181A19" stroke-width="5" stroke-linecap="round" fill="none">'+
  '<line x1="156" y1="52" x2="182" y2="118"/>'+
  '<line x1="146" y1="70" x2="168" y2="126"/>'+
  '</g>'+
  '<g fill="#181A19"><circle cx="150" cy="150" r="5"/><circle cx="172" cy="150" r="5"/></g>'+
  '<line x1="150" y1="166" x2="168" y2="166" stroke="#181A19" stroke-width="6" stroke-linecap="round"/>'+
  '<ellipse cx="224" cy="212" rx="12" ry="7" fill="#8CE7C0" stroke="#181A19" stroke-width="7"/>'+
  '</svg>';

function mountLogo(elId){
  const host = document.getElementById(elId);
  const img = new Image();
  img.alt = "the grong co.";
  img.onload = ()=>{ host.innerHTML = ""; host.appendChild(img); };
  img.onerror = ()=>{ host.innerHTML = LOGO_SVG; };
  img.src = "logo.png";
}
mountLogo("navLogo");
mountLogo("heroLogo");

// ====== TRADUCCIONES ======
const T = {
  es: {
    sys: 'estado: <span class="ok">wrong</span>',
    protoLabel: 'sistema central',
    tag: '<em>Not wrong. Grong.™</em> Cada semana, la IA fabrica, publica y promociona una idea que nadie pidió. Este es el registro oficial de the grong co.<span class="cursor"></span>',

    hMani: 'manifesto',

    subTh: '1 correo por lanzamiento · 0 spam',

    subBody: 'Cada semana lanzamos algo que nadie pidió. Suscríbete para que al menos alguien lo haya pedido, técnicamente.',
    subPh: 'tu@correo.com',

    subMsg: 'registrado. tu bandeja de entrada acaba de empeorar oficialmente.',

    ideaTitle: '¿Tienes una idea que valga la pena?',
    ideaBody: 'Mándala igual. Si es suficientemente <s style="color:var(--mint-deep)">mala</s> buena, la construimos, le ponemos serial y pasa a ser propiedad emocional del conglomerado. Crédito para ti, responsabilidad para nadie.',
    ideaPh: 'ej: una app que aplaude cuando terminas tus pendientes…',
    ideaBtn: 'enviar idea',
    ideaMsg: 'recibida. el comité (1 persona) la evaluará con rigor cuestionable.',
    subject_idea: '[GRONGIDEA] transmisión externa',
    body_idea: '— enviada desde the grong co.',
    mani: 'Creemos que la línea entre <em>wrong</em> y <span class="g">grong</span> es una sola letra, y la cruzamos cada semana. Entregamos lo innecesario con excelencia. Como un helado derretido: nadie lo pidió así — pero aquí está, y sigue rico.',
    footer: 'the grong co. © 2026 · All rights <s>reserved</s> wronged.<br>Sistema central del conglomerado. Contacto: hey@wirdolab.com · quejas: <span class="upside">al vacío, con confianza</span>',
    statIdeas: 'grongideas', statProd: 'en producción', statReq: 'solicitadas', statDeploy: 'deployment',
    nextDesc: 'La próxima semana. Será peor. Prometido.',

    title: 'the grong co. — not wrong. grong.'
  },
  en: {
    sys: 'status: <span class="ok">wrong</span>',
    protoLabel: 'central system',
    tag: '<em>Not wrong. Grong.™</em> Every week, AI builds, ships and markets an idea nobody asked for. This is the official registry of the grong co.<span class="cursor"></span>',
    wrongnote: 'note: everything on this site is <s>wrong</s> correct. if something looks like a bug, it\'s a feature.',
    hRegistry: 'grongidea registry',
    hTrans: 'latest transmission',
    hSub: 'subscribe',
    hIdea: 'idea inbox',
    hMani: 'manifesto',
    pressTh: 'for immediate release',
    pressTitle: 'the grong co. announces TheGrongMatch: the platform that tells you your red flags before your therapist does',
    pressBody: 'The conglomerate is pleased to announce GRONG-001, a romantic personality analysis with 4% accuracy. "We are very proud of something," declared the Chief Grong Officer, whose position remains vacant.',
    pressSig: 'imagined by the grong co.',
    subTh: '1 email per launch · 0 spam',
    subTitle: 'Hear about every grongidea before anyone else.',
    subBody: 'Every week we launch something nobody asked for. Subscribe so at least someone technically asked.',
    subPh: 'you@email.com',
    subBtn: 'subscribe',
    subMsg: 'registered. your inbox just officially got worse.',
    subject_sub: '[GRONG SUB] ',
    body_sub: 'I want to subscribe to the protocol.',
    ideaTh: 'suggestion protocol',
    ideaTitle: 'Got an idea actually worth building?',
    ideaBody: 'Send it anyway. If it\'s <s style="color:var(--mint-deep)">bad</s> good enough, we\'ll build it, give it a serial number, and it becomes emotional property of the conglomerate. Credit to you, responsibility to no one.',
    ideaPh: 'e.g. an app that claps when you finish your to-do list…',
    ideaBtn: 'send idea',
    ideaMsg: 'received. the committee (1 person) will evaluate it with questionable rigor.',
    subject_idea: '[GRONGIDEA] external transmission',
    body_idea: '— sent from the grong co.',
    mani: 'We believe the line between <em>wrong</em> and <span class="g">grong</span> is a single letter, and we cross it weekly. We deliver the unnecessary with excellence. Like a melted ice cream: nobody asked for it this way — but here it is, and it\'s still good.',
    footer: 'the grong co. © 2026 · All rights <s>reserved</s> wronged.<br>Central system of the conglomerate. Contact: hey@wirdolab.com · complaints: <span class="upside">into the void, with confidence</span>',
    statIdeas: 'grongideas', statProd: 'in production', statReq: 'requested', statDeploy: 'deployment',
    nextDesc: 'Next week. It will be worse. Promise.',
    stLiveTxt: 'live', stDevTxt: 'in development', stNextTxt: 'inevitable',
    title: 'the grong co. — not wrong. grong.'
  }
};

// ====== REGISTRO ======
const GRONGIDEAS = [
  {
    serial:"GRONG-001", name:"TheGrong", accent:"Match",
    desc:{
      es:"Matching por red flags. Certifica tus banderas rojas, encuentra gente igual de intensa y rompe el hielo con tus propios traumas.",
      en:"Matching by red flags. Get your red flags certified, find people just as intense as you, and break the ice with your own traumas."
    },
    status:"live", link:"red-flag-tester.html"
  },
  {
    serial:"GRONG-OO2", name:"TheGrong", accent:"Web",
    desc:{
      es:"Creador de páginas web para negocios reales: describe tu negocio y obtén un sitio con menú, catálogo u horarios según tu giro. 112 industrias, 0 solicitadas.",
      en:"Website builder for real businesses: describe your business and get a site with a menu, catalog or schedule for your industry. 112 industries, 0 requested."
    },
    status:"live", link:"https://wirdolab.github.io/thegrongweb/"
  },
  {
    serial:"GRONG-003", name:"TheGrong", accent:"Ex",
    desc:{
      es:"Tu historial romántico en formato recap anual. Las estadísticas que nadie pidió sobre gente que ya no está.",
      en:"Your romantic history as a yearly recap. The stats nobody asked for about people who are no longer around."
    },
    status:"live", link:"thegrongex.html"
  },
  {
    serial:"GRONG-004", name:"TheGrong", accent:"Call",
    desc:{
      es:"Botón de pánico que finge una llamada de emergencia entrante para sacarte de cualquier situación social incómoda. Timer configurable. EN/ES.",
      en:"A panic button that fakes an incoming emergency call to get you out of any awkward social situation. Configurable timer. EN/ES."
    },
    status:"live", link:"thegrongcall.html"
  }
];

// ====== IDIOMA ======
let LANG = (function(){ try { return localStorage.getItem("grong-lang") || "es"; } catch(e){ return "es"; } })();

function applyTexts(){
  const t = T[LANG];
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if(t[k] !== undefined) el.innerHTML = t[k];
  });
  document.querySelectorAll("[data-t-placeholder]").forEach(el=>{
    const k = el.getAttribute("data-t-placeholder");
    if(t[k] !== undefined) el.placeholder = t[k];
  });
  document.title = t.title;
  document.documentElement.lang = LANG;
  document.getElementById("langBtn").textContent = LANG === "es" ? "EN" : "ES";
}

function renderRegistry(){
  const t = T[LANG];
  const reg = document.getElementById("registry");
  reg.innerHTML = "";
  GRONGIDEAS.forEach(g=>{
    const el = document.createElement(g.link ? "a" : "div");
    if(g.link) el.href = g.link;
    el.className = "row";
    const stTxt = g.status==="live" ? t.stLiveTxt : t.stDevTxt;
    el.innerHTML =
      '<div class="serial">'+g.serial+'</div>'+
      '<div><div class="name">'+g.name+'<b>'+g.accent+'</b></div><div class="credit">imagined by the grong co.</div><div class="desc">'+g.desc[LANG]+'</div></div>'+
      '<div class="st '+g.status+'"><span class="dot"></span>'+stTxt+'</div>';
    reg.appendChild(el);
  });
  const nx = document.createElement("div");
  nx.className = "row nextrow";
  nx.innerHTML =
    '<div class="serial">GRONG-'+String(GRONGIDEAS.length+1).padStart(3,"0")+'</div>'+
    '<div><div class="name">···</div><div class="desc">'+t.nextDesc+'</div></div>'+
    '<div class="st"><span class="dot"></span>'+t.stNextTxt+'</div>';
  reg.appendChild(nx);
}

function renderStats(){
  const t = T[LANG];
  const live = GRONGIDEAS.filter(g=>g.status==="live").length;
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>'+GRONGIDEAS.length+'</b><span>'+t.statIdeas+'</span></div>'+
    '<div class="stat"><b>'+live+'</b><span>'+t.statProd+'</span></div>'+
    '<div class="stat"><b>0</b><span>'+t.statReq+'</span></div>'+
    '<div class="stat"><b class="pct-wrong">104%</b><span>'+t.statDeploy+'</span></div>';
}

function setLang(l){
  LANG = l;
  try { localStorage.setItem("grong-lang", l); } catch(e){}
  applyTexts(); renderRegistry(); renderStats();
}
function toggleLang(){ setLang(LANG === "es" ? "en" : "es"); }

function subscribe(){
  const t = T[LANG];
  const em = document.getElementById("subEmail").value.trim();
  if(!em || !em.includes("@")) return;
  window.location.href = "mailto:hey@wirdolab.com?subject=" + encodeURIComponent(t.subject_sub + em) +
    "&body=" + encodeURIComponent(t.body_sub);
  document.getElementById("subMsg").style.display = "block";
}
function submitIdea(){
  const t = T[LANG];
  const idea = document.getElementById("ideaBox").value.trim();
  if(!idea) return;
  window.location.href = "mailto:hey@wirdolab.com?subject=" + encodeURIComponent(t.subject_idea) +
    "&body=" + encodeURIComponent("Idea:\n" + idea + "\n\n" + t.body_idea);
  document.getElementById("ideaMsg").style.display = "block";
}

setLang(LANG);

// wordmark: grong ⇄ wrong, sutil
const flip = document.getElementById("flip");
const seq = ["grong","wrong","grong"];
let i = 0;
setInterval(()=>{ i = (i+1) % seq.length; flip.textContent = seq[i]; }, 2200);
</script>
</body>
</html>
